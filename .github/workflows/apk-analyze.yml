name: APK Analyze

# Static analysis for an APK checked into this repo. Produces a report and
# uploads it as an artifact. Read-only: nothing is published.
#
# Note on inputs: the APK path is a workflow_dispatch input rather than a glob
# so that a run always analyses exactly one file you chose. Change the default
# if you move the APK.

on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: "Path to the APK to analyse (relative to repo root)"
        required: true
        default: "loader/input/PHubLoader.apk"
      baseline_path:
        description: "Optional second APK to diff against (e.g. the stock build)"
        required: false
        default: "loader/input/PH_original.apk"
  push:
    branches: [main]
    paths:
      - "loader/input/**.apk"
      - "loader/scripts/**"
      - ".github/workflows/apk-analyze.yml"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: loader/requirements.txt

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r loader/requirements.txt

      - name: Resolve APK path
        id: resolve
        run: |
          set -euo pipefail
          # github.event.inputs is empty on push, so fall back to the checked-in
          # defaults rather than relying on the input default.
          APK="${{ github.event.inputs.apk_path }}"
          BASE="${{ github.event.inputs.baseline_path }}"
          [ -n "$APK" ] || APK="loader/input/PHubLoader.apk"
          [ -n "$BASE" ] || BASE="loader/input/PH_original.apk"

          if [ ! -f "$APK" ]; then
            echo "::warning::No APK at '$APK'. Commit one under loader/input/ or pass apk_path when dispatching."
            ls -la loader/input 2>/dev/null || true
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "Analysing: $APK ($(stat -c%s "$APK") bytes)"

          if [ -n "$BASE" ] && [ -f "$BASE" ]; then
            echo "has_baseline=true" >> "$GITHUB_OUTPUT"
            echo "baseline=$BASE" >> "$GITHUB_OUTPUT"
            echo "Baseline:  $BASE ($(stat -c%s "$BASE") bytes)"
          else
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
            [ -n "$BASE" ] && echo "::warning::baseline '$BASE' not found, skipping diff"
          fi

      - name: Extract APK metadata
        if: steps.resolve.outputs.found == 'true'
        run: |
          mkdir -p out
          python loader/scripts/apk_info.py "${{ steps.resolve.outputs.apk }}" \
            --json out/apk-info.json | tee out/apk-info.txt

      - name: Diff against baseline
        if: steps.resolve.outputs.has_baseline == 'true'
        run: |
          python loader/scripts/apk_diff.py \
            "${{ steps.resolve.outputs.baseline }}" \
            "${{ steps.resolve.outputs.apk }}" \
            --json out/apk-diff.json | tee out/apk-diff.txt

      - name: Triage native libraries
        if: steps.resolve.outputs.found == 'true'
        run: |
          mkdir -p out
          python loader/scripts/native_triage.py "${{ steps.resolve.outputs.apk }}" \
            --json out/native-triage.json | tee out/native-triage.txt

      - name: Summarise
        if: steps.resolve.outputs.found == 'true'
        run: |
          {
            echo "## APK analysis"
            echo
            echo '```'
            cat out/apk-info.txt
            echo '```'
            if [ -f out/apk-diff.txt ]; then
              echo
              echo "### Diff vs baseline"
              echo
              echo '```'
              head -c 20000 out/apk-diff.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: steps.resolve.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apk-analysis-${{ github.run_number }}
          path: out/
          retention-days: 30
          if-no-files-found: warn
