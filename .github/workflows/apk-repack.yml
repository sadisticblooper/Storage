name: APK Repack

# Decode an APK from loader/input/, apply a declarative patch spec, rebuild and
# sign it, then upload the result as an artifact.
#
# Signing: uses a throwaway debug keystore generated at runtime. Output is for
# local testing only -- it is NOT publishable and carries no identity guarantee.
# To use a real keystore, add repository secrets and reference them here.

on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: "Path to the source APK"
        required: true
        default: "loader/input/app.apk"
      patch_spec:
        description: "Patch spec to apply"
        required: true
        default: "loader/patches/example.yml"
      dry_run:
        description: "Only show what the patch would change"
        type: boolean
        required: false
        default: false
      strip_attrs:
        description: "Comma-separated android: attributes to strip (aapt2 workaround)"
        required: false
        default: "pageSizeCompat"

permissions:
  contents: read

jobs:
  repack:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pyelftools androguard==4.1.4 loguru
          sudo apt-get update -qq
          # apksigner/zipalign from Debian are the same tools as Android
          # build-tools; installing them is far faster than the SDK manager.
          sudo apt-get install -y -qq apksigner zipalign

      - name: Fetch apktool
        run: |
          set -euo pipefail
          mkdir -p tools
          ver="$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest \
                 | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"].lstrip("v"))')"
          echo "apktool $ver"
          curl -fsSL -o tools/apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${ver}/apktool_${ver}.jar"
          java -jar tools/apktool.jar --version

      - name: Verify inputs exist
        run: |
          set -euo pipefail
          APK="${{ github.event.inputs.apk_path }}"
          SPEC="${{ github.event.inputs.patch_spec }}"
          [ -f "$APK" ] || { echo "::error::APK not found: $APK"; exit 1; }
          [ -f "$SPEC" ] || { echo "::error::spec not found: $SPEC"; exit 1; }
          echo "apk=$APK" >> "$GITHUB_ENV"
          echo "spec=$SPEC" >> "$GITHUB_ENV"

      - name: Decode APK
        run: |
          set -euo pipefail
          java -jar tools/apktool.jar d -f -o decoded "$apk"
          echo "decoded tree:"
          ls decoded

      - name: Apply patch spec
        run: |
          set -euo pipefail
          flag=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then flag="--dry-run"; fi
          python loader/scripts/apply_patch.py decoded "$spec" $flag

      - name: Repack and sign
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          TOOLS_DIR: ${{ github.workspace }}/tools
          WORK_DIR: ${{ github.workspace }}/work
        run: |
          set -euo pipefail
          chmod +x loader/scripts/repack.sh loader/scripts/common.sh
          strip="${{ github.event.inputs.strip_attrs }}"
          args=()
          if [ -n "$strip" ]; then args+=(--strip-attrs "$strip"); fi
          bash loader/scripts/repack.sh decoded "out/patched.apk" "${args[@]}"

      - name: Verify rebuilt APK
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p out
          python loader/scripts/apk_info.py out/patched.apk | tee out/patched-info.txt
          {
            echo "## Repacked APK"
            echo
            echo '```'
            cat out/patched-info.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload patched APK
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: patched-apk-${{ github.run_number }}
          path: out/patched.apk
          retention-days: 14
